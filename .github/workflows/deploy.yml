# ============================================================================
# NOOBS Blog — GitHub Actions : Build & Deploy Jekyll
# Ce workflow se déclenche à chaque push sur main
# Il build le site Jekyll et le déploie sur GitHub Pages
# ============================================================================

name: "🚀 Build & Deploy NOOBS Blog"

on:
  push:
    branches: ["main"]
    paths:
      - "_posts/**"
      - "_pages/**"
      - "_layouts/**"
      - "_includes/**"
      - "_config.yml"
      - "assets/**"
      - "index.*"
  workflow_dispatch:  # Permet de déclencher manuellement depuis GitHub

# Permissions pour GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout du dépôt"
        uses: actions/checkout@v4

      - name: "💎 Setup Ruby & Jekyll"
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: "🔧 Configuration GitHub Pages"
        id: pages
        uses: actions/configure-pages@v5

      - name: "🏗️ Build Jekyll"
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: "📦 Upload artifact"
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: "🚀 Déploiement sur GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@v4
